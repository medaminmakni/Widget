<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget shopfront signage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF7A45}a:hover{color:#FF9C70}
</style>
</helmet>
<div style="width: 1440px; height: 800px; position: relative; overflow: hidden; background: #2B2E35; font-family: 'Instrument Sans', sans-serif; color: #F5F2EC">

  <div style="position: absolute; left: 230px; top: 36px; width: 18px; height: 24px; border-radius: 4px; background: #111318"></div>
  <div style="position: absolute; left: 500px; top: 36px; width: 18px; height: 24px; border-radius: 4px; background: #111318"></div>
  <div style="position: absolute; left: 770px; top: 36px; width: 18px; height: 24px; border-radius: 4px; background: #111318"></div>
  <div style="position: absolute; left: 1000px; top: 36px; width: 18px; height: 24px; border-radius: 4px; background: #111318"></div>
  <div style="position: absolute; left: 180px; top: 56px; width: 880px; height: 30px; background: rgba(255,214,170,0.10); border-radius: 50%"></div>

  <div style="position: absolute; left: 160px; top: 70px; width: 900px; height: 150px; background: #0D0F14; border-radius: 6px; box-shadow: 0 18px 36px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; gap: 36px">
    <svg viewBox="-2 4 96 100" width="84" height="88" aria-hidden="true" style="filter: drop-shadow(0 0 10px rgba(255,91,31,0.35))"><rect x="4" y="24" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
    <div style="width: 1px; height: 86px; background: #3A3F4B"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 68px; line-height: 1; letter-spacing: -0.01em; text-shadow: 0 0 18px rgba(255,236,214,0.35)">widget</span>
      <span style="font-weight: 600; font-size: 15px; letter-spacing: 0.34em; text-transform: uppercase; color: {{accent}}; padding-left: 3px">Consulting</span>
    </div>
  </div>

  <div style="position: absolute; left: 220px; top: 250px; width: 780px; height: 470px; background: #15171C; box-sizing: border-box; border: 10px solid #111318; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0px">
    <div style="background: #1C2027; position: relative"><div style="position: absolute; left: 30px; top: 60px; width: 110px; height: 140px; border: 2px solid #3A3F4B; border-radius: 4px"></div></div>
    <div style="background: #1C2027; position: relative"><div style="position: absolute; left: 0px; right: 0px; top: 300px; height: 40px; background: #2A2E38"></div></div>
    <div style="background: #1C2027; position: relative"><div style="position: absolute; left: 60px; top: 70px; width: 80px; height: 80px; border-radius: 12px; background: {{accent}}; opacity: 0.85; transform: rotate(8deg)"></div></div>
  </div>
  <div style="position: absolute; left: 220px; top: 258px; width: 780px; height: 14px; background: repeating-linear-gradient(90deg, #111318 0px, #111318 2px, #1A1C22 2px, #1A1C22 8px)"></div>

  <div style="position: absolute; left: 1192px; top: 214px; width: 26px; height: 20px; border-radius: 4px; background: #111318"></div>
  <div style="position: absolute; left: 1110px; top: 240px; width: 210px; height: 400px; background: #0D0F14; border-radius: 6px; box-shadow: 0 18px 36px rgba(0,0,0,0.45); box-sizing: border-box; padding: 34px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <svg viewBox="-2 4 96 100" width="60" height="63" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -0.01em">widget</span>
      <span style="font-weight: 600; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: {{accent}}; padding-left: 0.3em">Consulting</span>
    </div>
    <div style="width: 60%; height: 1px; background: #3A3F4B"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px; font-size: 13px; color: #C9CDD4">
      <span>Web platforms</span>
      <span>Mobile apps</span>
      <span>Data &amp; dashboards</span>
      <span>Custom software</span>
      <span>IT consulting</span>
    </div>
  </div>

  <div style="position: absolute; left: 0px; top: 720px; width: 1440px; height: 80px; background: #1E2026; display: flex; align-items: center; gap: 48px; box-sizing: border-box; padding: 0 160px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A4A9B4">
    <span>FASCIA · matte black panel, backlit 3D letters, warm white LED</span>
    <span>BLADE SIGN · double-sided, wall-mounted</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B1F","options":["#FF5B1F","#FF7A1A","#F04E23","#FFB020"]},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5B1F' };
  }
}
</script>
</body>
</html>
