<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget business cards and letterhead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 1440px; height: 800px; position: relative; overflow: hidden; background: #1A1D24; font-family: 'Instrument Sans', sans-serif">

  <div style="position: absolute; left: 90px; top: 70px; width: 510px; height: 330px; border-radius: 14px; background: #0D0F14; transform: rotate(-3deg); box-shadow: 0 30px 60px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 20px; color: #F5F2EC">
      <svg viewBox="-2 4 96 100" width="64" height="67" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
      <div style="width: 1px; height: 64px; background: #3A3F4B"></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 50px; line-height: 1; letter-spacing: -0.01em">widget</span>
        <span style="font-weight: 600; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: {{accent}}; padding-left: 2px">Consulting</span>
      </div>
    </div>
    <div style="position: absolute; left: 0px; right: 0px; bottom: 0px; height: 6px; background: {{accent}}"></div>
  </div>

  <div style="position: absolute; left: 150px; top: 420px; width: 510px; height: 330px; border-radius: 14px; background: #F5F2EC; color: #12141C; transform: rotate(2deg); box-shadow: 0 30px 60px rgba(0,0,0,0.45); box-sizing: border-box; padding: 40px; display: flex; justify-content: space-between">
    <div style="display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">[Your name]</span>
        <span style="font-size: 14px; font-weight: 600; color: #C2410C">[Your role]</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #333842">
        <span>[+216 phone / WhatsApp]</span>
        <span>[name@yourdomain]</span>
        <span>[yourdomain.com]</span>
        <span>Sfax, Tunisia</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between">
      <svg viewBox="-2 4 96 100" width="44" height="46" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #565B66">WEB · MOBILE · DATA</span>
    </div>
  </div>

  <div style="position: absolute; left: 820px; top: 60px; width: 470px; height: 665px; background: #FFFFFF; color: #12141C; box-shadow: 0 30px 60px rgba(0,0,0,0.45); box-sizing: border-box; padding: 44px 48px; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg viewBox="-2 4 96 100" width="24" height="25" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">widget</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 9px; color: #565B66"><span>[contact@yourdomain]</span><span>[+216 phone]</span><span>Sfax, Tunisia</span></div>
    </div>
    <div style="margin-top: 56px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 10px; color: #565B66">[Date]</span>
      <span style="font-size: 11px; font-weight: 600">Proposal: [Project name]</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="height: 6px; width: 100%; background: #ECEAE5; border-radius: 3px"></div>
        <div style="height: 6px; width: 94%; background: #ECEAE5; border-radius: 3px"></div>
        <div style="height: 6px; width: 97%; background: #ECEAE5; border-radius: 3px"></div>
        <div style="height: 6px; width: 70%; background: #ECEAE5; border-radius: 3px"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
        <div style="height: 6px; width: 100%; background: #ECEAE5; border-radius: 3px"></div>
        <div style="height: 6px; width: 88%; background: #ECEAE5; border-radius: 3px"></div>
        <div style="height: 6px; width: 92%; background: #ECEAE5; border-radius: 3px"></div>
      </div>
    </div>
    <div style="position: absolute; right: 40px; bottom: 40px; width: 64px; height: 64px; border-radius: 14px; background: {{accent}}; transform: rotate(8deg)"></div>
    <div style="position: absolute; left: 48px; bottom: 44px; font-size: 9px; color: #565B66">Widget Consulting · yourdomain.com</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B1F","options":["#FF5B1F","#FF7A1A","#F04E23","#FFB020"]},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5B1F' };
  }
}
</script>
</body>
</html>
