<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget logo system</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; padding: 64px; background: #F5F2EC; color: #12141C; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; gap: 32px">

  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 750; font-size: 36px; letter-spacing: -0.03em">Logo system</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #565B66">The missing piece, sliding into place</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex-grow: 1">

    <div style="background: #FFFFFF; border: 1px solid #DCD6CB; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #565B66">Primary</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 14px; position: relative">
        <svg viewBox="-2 4 96 100" width="58" height="60" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
        <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 52px; line-height: 1.05; letter-spacing: -0.01em">widget</div><div style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #565B66; padding-left: 2px">Consulting</div></div>
      </div>
    </div>

    <div style="background: #12141C; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; color: #F5F2EC">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9EA3AD">Reversed</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 14px">
        <svg viewBox="-2 4 96 100" width="58" height="60" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#F5F2EC"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
        <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 52px; line-height: 1.05; letter-spacing: -0.01em">widget</div><div style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #9EA3AD; padding-left: 2px">Consulting</div></div>
      </div>
    </div>

    <div style="background: {{accent}}; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; color: #12141C">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">On orange</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 14px">
        <svg viewBox="-2 4 96 100" width="58" height="60" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="#F5F2EC"></rect></svg>
        <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 52px; line-height: 1.05; letter-spacing: -0.01em">widget</div><div style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; padding-left: 2px">Consulting</div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DCD6CB; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #565B66">Stacked</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
        <svg viewBox="-2 4 96 100" width="96" height="100" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.05; letter-spacing: -0.01em">widget</div><div style="font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #565B66; padding-left: 0.2em">Consulting</div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DCD6CB; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #565B66">Symbol · scales down to 16 px</div>
      <div style="flex-grow: 1; display: flex; align-items: flex-end; justify-content: center; gap: 40px; padding-bottom: 40px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><svg viewBox="-2 4 96 100" width="128" height="133" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #565B66">128</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><svg viewBox="-2 4 96 100" width="48" height="50" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #565B66">48</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><svg viewBox="-2 4 96 100" width="24" height="25" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #565B66">24</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><svg viewBox="-2 4 96 100" width="16" height="17" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #565B66">16</span></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DCD6CB; border-radius: 20px; height: 410px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #565B66">Construction</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
        <svg viewBox="-2 4 96 100" width="260" height="271" aria-hidden="true">
          <rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect>
          <rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect>
          <rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect>
          <rect x="44.5" y="24.5" width="35" height="35" rx="7.5" fill="none" stroke="#565B66" stroke-width="0.8" stroke-dasharray="2 2"></rect>
          <path d="M62 52 L70 36" stroke="#565B66" stroke-width="0.8" stroke-dasharray="2 2" fill="none"></path>
          <rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect>
        </svg>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B1F","options":["#FF5B1F","#FF7A1A","#F04E23","#FFB020"]},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5B1F' };
  }
}
</script>
</body>
</html>
