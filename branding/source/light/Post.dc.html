<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget launch post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 1080px; height: 1080px; position: relative; overflow: hidden; background: #F5F2EC; color: #12141C; font-family: 'Instrument Sans', sans-serif">

  <div style="position: absolute; left: 80px; top: 80px; display: flex; align-items: center; gap: 12px">
    <svg viewBox="-2 4 96 100" width="40" height="42" aria-hidden="true"><rect x="4" y="24" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="4" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="44" y="64" width="36" height="36" rx="8" fill="#12141C"></rect><rect x="52" y="8" width="36" height="36" rx="8" fill="{{accent}}"></rect></svg>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.01em">widget</span>
  </div>

  <div style="position: absolute; left: 80px; top: 220px; width: 860px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 780; font-size: 128px; line-height: 0.95; letter-spacing: -0.045em">New look.<br>Same builders.</div>

  <div style="position: absolute; left: 80px; top: 500px; width: 470px; font-size: 26px; line-height: 1.45; color: #565B66">Web, mobile, data, custom software, cloud and IT consulting — for clients everywhere.</div>

  <div style="position: absolute; right: 80px; bottom: 80px; width: 380px; height: 380px">
    <div style="position: absolute; left: 0px; top: 196px; width: 180px; height: 180px; border-radius: 38px; background: #12141C"></div>
    <div style="position: absolute; left: 196px; top: 196px; width: 180px; height: 180px; border-radius: 38px; background: #12141C"></div>
    <div style="position: absolute; left: 0px; top: 0px; width: 180px; height: 180px; border-radius: 38px; background: #12141C"></div>
    <div style="position: absolute; left: 196px; top: 0px; width: 180px; height: 180px; border-radius: 38px; border: 3px dashed #B9B2A5; box-sizing: border-box"></div>
    <div style="position: absolute; left: 236px; top: -78px; width: 180px; height: 180px; border-radius: 38px; background: {{accent}}; transform: rotate(9deg); box-shadow: 0 24px 48px rgba(18,20,28,0.22)"></div>
  </div>

  <div style="position: absolute; left: 80px; bottom: 80px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: #C2410C">Let&#39;s build yours</div>
    <div style="font-size: 24px; font-weight: 600">Send us a message →</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5B1F","options":["#FF5B1F","#FF7A1A","#F04E23","#FFB020"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5B1F' };
  }
}
</script>
</body>
</html>
